name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Lint, typecheck and every test. The stage-move tests run the real
      # migrations and SQL on an in-process Postgres (PGlite); nothing here
      # connects to a real database.
      - run: npm run check

      - run: npm audit --omit=dev

      - run: npm run build
